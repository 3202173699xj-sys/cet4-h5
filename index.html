<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>四级刷题</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ============ 首页 ============ -->
<div id="view-home" class="view">
  <h1 class="app-title">四级刷题</h1>
  <div class="home-btns">
    <button class="big-btn" id="btn-seq">顺序练习</button>
    <button class="big-btn" id="btn-special">专项练习</button>
    <button class="big-btn" id="btn-wrong">错题本</button>
  </div>
  <div class="home-stats" id="home-stats"></div>
  <button class="text-btn" id="btn-reset-seq">清空答题记录，从头开始</button>
</div>

<!-- ============ 专项选择页 ============ -->
<div id="view-filter" class="view hidden">
  <div class="topbar">
    <button class="back-btn" data-go="home">‹ 返回</button>
    <span class="topbar-title">专项练习</span>
  </div>
  <div class="filter-form">
    <label>题型</label>
    <select id="f-type">
      <option value="all">全部</option>
      <option value="listening">听力</option>
      <option value="reading">阅读</option>
    </select>
    <label>套次</label>
    <select id="f-set"><option value="all">全部套次</option></select>
    <label>标签</label>
    <select id="f-tag"><option value="all">全部标签</option></select>
    <div class="filter-count" id="f-count"></div>
    <button class="big-btn" id="btn-start-special">开始练习</button>
  </div>
</div>

<!-- ============ 答题页 ============ -->
<div id="view-quiz" class="view hidden">
  <div class="topbar">
    <button class="back-btn" id="quiz-back">‹ 退出</button>
    <span class="topbar-title" id="quiz-progress"></span>
  </div>
  <div class="quiz-meta" id="quiz-meta"></div>
  <details class="passage-box hidden" id="quiz-passage-box">
    <summary>原文第一段（点击展开/收起）</summary>
    <p id="quiz-passage"></p>
  </details>
  <div class="quiz-stem" id="quiz-stem"></div>
  <div id="quiz-body"></div>
  <!-- 上一题常驻，与下一题并排 -->
  <div class="quiz-nav">
    <button class="nav-btn" id="btn-prev">‹ 上一题</button>
    <button class="nav-btn primary" id="btn-next">下一题 ›</button>
  </div>
</div>

<!-- ============ 错题本页 ============ -->
<div id="view-wrong" class="view hidden">
  <div class="topbar">
    <button class="back-btn" data-go="home">‹ 返回</button>
    <span class="topbar-title">错题本</span>
  </div>
  <div class="tab-bar">
    <button class="tab active" id="tab-pending">待复习</button>
    <button class="tab" id="tab-all">全部错题</button>
  </div>
  <div class="wrong-list" id="wrong-list"></div>
  <div class="wrong-tools">
    <button class="tool-btn" id="btn-export">导出错题本 JSON</button>
    <button class="tool-btn" id="btn-import">导入错题本 JSON</button>
    <input type="file" id="import-file" accept=".json" class="hidden">
    <button class="tool-btn danger" id="btn-clear-wrong">清空错题本</button>
    <button class="tool-btn danger" id="btn-clear-all">清除全部本地数据</button>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
